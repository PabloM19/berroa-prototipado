<button class="garden-chat-launcher" type="button" aria-controls="garden-chat" aria-expanded="false" aria-label="Abrir asistente de Berroa" hidden>
  <span>¿Hablamos de plantas?</span><span class="garden-chat-launcher-icon"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg></span>
</button>
<dialog class="garden-chat" id="garden-chat" aria-labelledby="garden-chat-title" tabindex="-1">
  <header class="garden-chat-header">
    <img src="/assets/images/jardinarium-sello.png" alt="" width="45" height="45">
    <div><p>BERROA GARDEN</p><h2 id="garden-chat-title">Entre plantas.</h2></div>
    <button type="button" data-chat-close aria-label="Cerrar asistente"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button>
  </header>
  <div class="garden-chat-tools"><button type="button" data-chat-reset><svg class="icon icon-small" aria-hidden="true"><use href="#i-reset"/></svg>Empezar de nuevo</button></div>
  <div class="garden-chat-log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Conversación con Berroa" tabindex="0"></div>
  <footer class="garden-chat-footer">
    <form class="garden-chat-form">
      <label class="chat-sr-only" for="garden-chat-input">Escribe tu mensaje</label>
      <textarea id="garden-chat-input" name="message" rows="1" maxlength="300" placeholder="¿En qué te ayudamos?" required></textarea>
      <button type="submit" aria-label="Enviar mensaje" disabled><svg class="icon icon-small" aria-hidden="true"><use href="#i-paper-plane"/></svg></button>
    </form>
    <p><span>DEMO</span> Respuestas preparadas para que lo pruebes.</p>
  </footer>
</dialog>
